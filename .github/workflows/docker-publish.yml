name: Publish OmniCon Docker image

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: omnicon-docker-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image version
        id: image
        shell: bash
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Set the DOCKERHUB_USERNAME secret"; exit 1; }
          echo "name=${DOCKERHUB_USERNAME}/omnicon" >> "$GITHUB_OUTPUT"
          echo "version=main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete older Docker Hub tags
        shell: bash
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail
          auth=$(jq -cn --arg identifier "$DOCKERHUB_USERNAME" --arg secret "$DOCKERHUB_TOKEN" \
            '{identifier: $identifier, secret: $secret}' |
            curl --fail-with-body --silent --show-error \
              -H 'Content-Type: application/json' --data-binary @- \
              https://hub.docker.com/v2/auth/token)
          token=$(jq -er '.access_token | strings | select(length > 0)' <<< "$auth")
          echo "::add-mask::$token"
          tags_url="https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/omnicon/tags/"
          page=1
          tags='[]'

          # Collect every page before deleting tags, so pagination cannot skip entries.
          while true; do
            response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $token" "${tags_url}?page_size=100&page=${page}")
            page_tags=$(jq -ce '.results | arrays' <<< "$response")
            tags=$(jq -cn --argjson tags "$tags" --argjson page "$page_tags" '$tags + $page')
            next=$(jq -r '.next // empty' <<< "$response")
            if [ -z "$next" ]; then break; fi
            page=$((page + 1))
          done

          # Never remove the previous release unless both newly published tags exist.
          if ! jq -e --arg version "$IMAGE_VERSION" \
            'any(.[]; .name == "latest") and any(.[]; .name == $version)' <<< "$tags" > /dev/null; then
            echo "::error::New image tags are missing from Docker Hub; refusing to delete older tags"
            exit 1
          fi
          old_tags=$(jq -r --arg version "$IMAGE_VERSION" \
            '.[] | select(.name != "latest" and .name != $version) | .name' <<< "$tags")
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then continue; fi
            echo "Deleting old tag: $tag"
            curl --fail-with-body --silent --show-error --request DELETE \
              -H "Authorization: Bearer $token" "${tags_url}${tag}/"
          done <<< "$old_tags"
