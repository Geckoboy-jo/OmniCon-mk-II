name: Code Quality

on:
  pull_request:
  push:
    branches:
      - main
      - develop
permissions: 
    contents: write
jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            clang-tidy \
            clang-format \
            cmake \
            ninja-build

      - name: Configure Build
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run Clang-Tidy
        run: |
          find . -name "*.cpp" \
            -exec clang-tidy {} -p build -fix-errors \;

      
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git diff --cached --quiet || git commit -m "Auto upgrading code"
          git push

      
       