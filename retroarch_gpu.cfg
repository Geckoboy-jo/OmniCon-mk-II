# In WSL2 the NVIDIA Vulkan driver is Windows-only, so Vulkan falls back to
# llvmpipe (software/CPU rendering) and games run at ~16 FPS. OpenGL is routed
# to the real GPU through Mesa's D3D12 driver (glxinfo reports
# "D3D12 (NVIDIA GeForce RTX 3060)"), so use it for hardware acceleration.
video_driver = "gl"
